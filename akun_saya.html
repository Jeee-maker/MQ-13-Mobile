<script>
  // Cek apakah sudah login
  const dataMurid = JSON.parse(localStorage.getItem('userLogin'));

  if (!dataMurid) {
    window.location.href = 'index.html';
  } else {
    // Tampilkan ID dan nama murid
    document.getElementById('akun-id').textContent = 'ID : ' + (dataMurid.id_murid ?? '-');
    document.getElementById('akun-nama').textContent = dataMurid.nama;
  }

  // Fungsi logout — hapus data login lalu kembali ke halaman login
  function logout() {
    if (confirm('Yakin mau keluar?')) {
      localStorage.removeItem('userLogin');
      window.location.href = 'index.html';
    }
  }
</script>
